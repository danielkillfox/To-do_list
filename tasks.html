<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Test</title>
        <script src="script.js" defer></script>
    </head>
    <body>
        <header class="conteiner">
            <div class="Logo_and_Label">
                <img class="Logo" src="Stylized_Brain_Logo_with_Symmetrical_Nodes-removebg-preview 500x500.png">
                <h1 class="temp_text_1" data-i18n="product_name">Name of Product</h1>
            </div>
        </header>
        <main class="conteiner">
            <div class="temp_text_container">
                <p class="temp_text" data-i18n="tagline">Dont Forget.What important to you</p>
            </div>


            <div class="language_container"> <!--Тут будет выбор языка-->
                <select id="language">
                    <option value="ru" selected>Русский</option>
                    <option value="en-US">English (US)</option>
                    <option value="en-GB">English (UK)</option>
                </select>
            </div>

            <dialog id="addwindow"> <!--Есть его не видно, пока не вызван через showModal() -->
                <form method="dialog"> <!--method="dialog" — браузер сам закроет окно и запишет value кнопки в dialog.returnValue-->
                    <input type="date" name="date" id="date" required>
                    <input type="text" name="label" id="label" placeholder="Label" data-i18n-placeholder="label_ph" required>
                    <input type="text" name="zametca" id="zametca" placeholder="Note" data-i18n-placeholder="note_ph">
                    <input type="checkbox" name="done" id="true_or_false">
                    <button value="Cancel" id="addwindow_cancelbutton" formnovalidate data-i18n="cancel">Cancel</button>
                    <button value="Ok" id="addwindow_continuebutton" data-i18n="add">Add</button>
                </form>
            </dialog>


            <div class="to_do_list"> 
<!--Есть 3 идеи.1) Кноака добовляет элемент таблицы с ее содержимым.2)Кнопка добовляет уже в сущесвующую таблицу заметку 3) Создание модульного окна-->
                <button class="addbtn_style" id="addbtn" type="button" data-i18n="add_new">Add New</button>
                <table>
                    <thead>
                    </thead>
                    <tbody>

                    </tbody>
                    <tfoot>
                        
                    </tfoot>
                </table>
            </div>
        </main>
    </body>
</html>
